{% load crispy_forms_tags %}
{% load static %}

<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HelpDesk</title>
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0-alpha1/css/bootstrap.min.css"
              integrity="sha512-72OVeAaPeV8n3BdZj7hOkaPSEk/uwpDkaGyP4W2jSzAC8tfiO4LMEDWoL3uFp5mcZu+8Eehb4GhZWFwvrss69Q=="
              crossorigin="anonymous"
              referrerpolicy="no-referrer" />
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.3/font/bootstrap-icons.min.css"
              integrity="sha512-YFENbnqHbCRmJt5d+9lHimyEMt8LKSNTMLSaHjvsclnZGICeY/0KYEeiHwD1Ux4Tcao0h60tdcMv+0GljvWyHg=="
              crossorigin="anonymous"
              referrerpolicy="no-referrer" />
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
              integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
              crossorigin="anonymous"
              referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="{% static 'css/custom-elements.css' %}" />
    </head>
    <body>
        {% include "navbar.html" %}
        <div class="container">
            <div class="fs-3 user_hello" id="{{ user.username }}">
                Добро пожаловать {{ user.first_name }}!
            </div>
            <div class="row">
                <div class="col mt-3">
                    <form action="{% url 'new' %}" method="post" enctype="multipart/form-data">
                        {% csrf_token %} {{ form|crispy }}
                        <div class="text-end">
                            <button type="submit" class="btn btn-primary px-5 btn-lg">Отправить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <script defer
                src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0-alpha1/js/bootstrap.bundle.min.js"
                integrity="sha512-Sct/LCTfkoqr7upmX9VZKEzXuRk5YulFoDTunGapYJdlCwA+Rl4RhgcPCLf7awTNLmIVrszTPNUFu4MSesep5Q=="
                crossorigin="anonymous"
                referrerpolicy="no-referrer"></script>
        <script defer
                type="application/javascript"
                src="{% static 'js/colorized.js' %}"></script>
        <script defer type="application/javascript" src="{% static 'js/paste.js' %}"></script>
        <script preload src="{% static 'js/theme.js' %}"></script>
    </body>
</html>
