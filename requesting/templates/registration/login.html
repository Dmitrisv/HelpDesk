{% load crispy_forms_tags %}

<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Авторизация</title>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0-alpha1/css/bootstrap.min.css"
          integrity="sha512-72OVeAaPeV8n3BdZj7hOkaPSEk/uwpDkaGyP4W2jSzAC8tfiO4LMEDWoL3uFp5mcZu+8Eehb4GhZWFwvrss69Q=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer"/>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0-alpha1/js/bootstrap.bundle.min.js" integrity="sha512-Sct/LCTfkoqr7upmX9VZKEzXuRk5YulFoDTunGapYJdlCwA+Rl4RhgcPCLf7awTNLmIVrszTPNUFu4MSesep5Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  </head>
  <body>
    <div class="container">
      {% block content %}
        <div class="position-absolute top-50 start-50 translate-middle">
          <div class="text-center">
            <h3>Авторизация</h3>
          </div>
          <form method="post">
            {% csrf_token %} {{ form|crispy }}
            <div>
              Нет еще учетной записи? <a href="/sign-up/">Зарегестрироваться</a>
            </div>
            <div class="text-end">
              <button type="submit" class="btn btn-primary px-5 btn-lg mt-3">Войти</button>
            </div>
          </form>
        {% endblock %}
      </div>
    </div>
  </body>
</html>
