{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HelpDesk | Статьи</title>
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0-alpha1/css/bootstrap.min.css"
              integrity="sha512-72OVeAaPeV8n3BdZj7hOkaPSEk/uwpDkaGyP4W2jSzAC8tfiO4LMEDWoL3uFp5mcZu+8Eehb4GhZWFwvrss69Q=="
              crossorigin="anonymous"
              referrerpolicy="no-referrer" />
    </head>
    <body>
        <div class="container">
            <form class="d-flex py-3" method="get" action="" role="search">
                <input class="form-control me-2" type="search" name="q" placeholder="Поиск">
                <button class="btn btn-outline-success" type="submit">Поиск</button>
            </form>
            <div class="vstack gap-3">
                {% for article in articles %}
                    <a href="{{ article.slug }}" class="text-decoration-none">
                        <div class="card">
                            <div class="card-body">
                                <div class="text-body">{{ article.title }}</div>
                            </div>
                        </div>
                    </a>
                {% endfor %}
            </div>
        </div>
    </body>
    <script async src="{% static 'js/theme.js' %}"></script>
</html>
