services:
  django:
    build: 
      context: .
      dockerfile: ./Dockerfile
    depends_on:
      - postgres
    expose:
      - 8000
    volumes:
      - static_data:/app/staticfiles
    restart: unless-stopped
    command: ["bash","./start.sh"]

  postgres:
    image: postgres:15
    env_file:
      - ./.env
    restart: unless-stopped

  nginx:
    image: nginx:latest
    depends_on:
      - django
    ports:
      - "80:80"
    volumes:
      - ./nginx-conf.d:/etc/nginx/conf.d
      - static_data:/var/www/static

volumes:
  static_data: